<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcEscrow - Deposit System</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 50px; text-align: center; background-color: #f4f7f6; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; }
        button { background-color: #28a745; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 20px; font-weight: bold; }
        button:hover { background-color: #218838; }
        #status { margin-top: 15px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

<div class="card">
    <h2>ArcEscrow Deposit System</h2>
    <p><strong>Buyer Address:</strong> 0xeF2b94566BE5F10276042F7BaBB54985EE119C95</p>
    <p><strong>Seller Address:</strong> 0x0814D1586F528db4023A6860cf9BE6EDDDE765d1</p>
    
    <button id="depositBtn" onclick="handleDeposit()">Connect & Deposit USDC</button>
    <div id="status"></div>
</div>

<script>
    // =============================================================
    // ১. CONFIGURATION (APNAR DATA BOSANO HOYECHE)
    // =============================================================
    const escrowContractAddress = "0x675737C2e0F5bFA2feE955e6e1F32b12b4402b52"; 
    const usdcTokenAddress = "0x3600000000000000000000000000000000000000"; 

    // =============================================================
    // ২. ABI DEFINITIONS
    // =============================================================
    const erc20ABI = [
        "function approve(address spender, uint256 amount) public returns (bool)",
        "function allowance(address owner, address spender) public view returns (uint256)"
    ];

    const escrowABI = [
        "function deposit() external",
        "function amount() view returns (uint256)"
    ];

    // =============================================================
    // ৩. MAIN DEPOSIT LOGIC
    // =============================================================
    async function handleDeposit() {
        const statusDiv = document.getElementById("status");
        try {
            if (!window.ethereum) {
                alert("MetaMask khuje paoya jayni! Please MetaMask install korun।");
                return;
            }
            
            statusDiv.style.color = "#333";
            statusDiv.innerText = "Wallet connect kora hocche...";
            
            await window.ethereum.request({ method: 'eth_requestAccounts' });
            const provider = new ethers.providers.Web3Provider(window.ethereum);
            const signer = provider.getSigner();
            const userAddress = await signer.getAddress();

            const expectedBuyer = "0xeF2b94566BE5F10276042F7BaBB54985EE119C95";

            if (userAddress.toLowerCase() !== expectedBuyer.toLowerCase()) {
                statusDiv.style.color = "red";
                statusDiv.innerText = "Error: Apni contract-er Buyer address (0xeF2b...) diye login korenni।";
                alert("Somossa: Sudhumatru Buyer address connect thaklei deposit kaj korbe।");
                return;
            }

            statusDiv.innerText = "Contract specifications read kora hocche...";
            const escrowContract = new ethers.Contract(escrowContractAddress, escrowABI, signer);
            const usdcContract = new ethers.Contract(usdcTokenAddress, erc20ABI, signer);

            const depositAmount = await escrowContract.amount();

            statusDiv.innerText = "USDC Allowance check kora hocche...";
            const currentAllowance = await usdcContract.allowance(userAddress, escrowContractAddress);

            // STEP 1: APPROVE
            if (currentAllowance.lt(depositAmount)) {
                statusDiv.innerText = "MetaMask-e prothome USDC Allowance Approve (Gas fee) korun...";
                const approveTx = await usdcContract.approve(escrowContractAddress, depositAmount);
                statusDiv.innerText = "Approval process complete howar jonno wait kora hocche...";
                await approveTx.wait(); 
            }

            // STEP 2: DEPOSIT TRANSACTION
            statusDiv.innerText = "Ekhon MetaMask-e main Escrow Deposit-ti confirm (Gas fee) korun...";
            const depositTx = await escrowContract.deposit();
            statusDiv.innerText = "Blockchain network-e deposit confirm kora hocche...";
            await depositTx.wait(); 
            
            statusDiv.style.color = "green";
            statusDiv.innerText = "Success! Escrow deposit thikbhabe somponno hoyeche।";
            alert("Sfolota! Deposit thikbhabe somponno hoyeche।");

        } catch (error) {
            console.error("Transaction Error:", error);
            statusDiv.style.color = "red";
            statusDiv.innerText = "Error: " + (error.data?.message || error.message);
        }
    }
</script>

</body>
</html>
