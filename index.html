<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcEscrow - Premium Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); 
            color: #f8fafc; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        h2 { font-size: 28px; margin-bottom: 10px; font-weight: 700; color: #38bdf8; letter-spacing: -0.5px; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        .info-box { background: rgba(15, 23, 42, 0.6); padding: 16px; border-radius: 14px; margin-bottom: 12px; text-align: left; border: 1px solid rgba(255, 255, 255, 0.05); }
        .info-box span { display: block; font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .info-box p { font-family: 'Courier New', Courier, monospace; font-size: 13px; color: #e2e8f0; word-break: break-all; }
        button {
            width: 100%;
            background: linear-gradient(90deg, #38bdf8 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(38, 189, 248, 0.4); opacity: 0.95; }
        button:active { transform: translateY(1px); }
        #status { 
            margin-top: 20px; 
            font-size: 14px; 
            padding: 12px; 
            border-radius: 10px; 
            display: none; 
            background: rgba(255, 255, 255, 0.05);
            animation: fadeIn 0.3s ease forwards;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <h2>ArcEscrow Portal</h2>
    <p class="subtitle">Secure Escrow Deposit Dashboard</p>
    
    <div class="info-box">
        <span>Buyer Address (Depositor)</span>
        <p>0xeF2b94566BE5F10276042F7BaBB54985EE119C95</p>
    </div>
    
    <div class="info-box">
        <span>Seller Address (Beneficiary)</span>
        <p>0x0814D1586F528db4023A6860cf9BE6EDDDE765d1</p>
    </div>

    <div class="info-box">
        <span>Contract Routing</span>
        <p>0x675737C2e0F5bFA2feE955e6e1F32b12b4402b52</p>
    </div>
    
    <button id="depositBtn" onclick="handleDeposit()">Connect & Deposit Funds</button>
    
    <div id="status"></div>
</div>

<script>
    // =============================================================
    // CONFIGURATION
    // =============================================================
    const escrowContractAddress = "0x675737C2e0F5bFA2feE955e6e1F32b12b4402b52"; 
    const usdcTokenAddress = "0x3600000000000000000000000000000000000000"; 

    const erc20ABI = [
        "function approve(address spender, uint256 amount) public returns (bool)",
        "function allowance(address owner, address spender) public view returns (uint256)"
    ];

    const escrowABI = [
        "function deposit() external",
        "function amount() view returns (uint256)"
    ];

    // =============================================================
    // SYSTEM LOGIC
    // =============================================================
    async function handleDeposit() {
        const statusDiv = document.getElementById("status");
        statusDiv.style.display = "block";
        
        try {
            if (!window.ethereum) {
                alert("MetaMask not found! Please install MetaMask extension.");
                statusDiv.style.color = "#f87171";
                statusDiv.innerText = "❌ Error: MetaMask is required.";
                return;
            }
            
            statusDiv.style.color = "#38bdf8";
            statusDiv.innerText = "🔄 Connecting to secure wallet session...";
            
            await window.ethereum.request({ method: 'eth_requestAccounts' });
            const provider = new ethers.providers.Web3Provider(window.ethereum);
            const signer = provider.getSigner();
            const userAddress = await signer.getAddress();

            const expectedBuyer = "0xeF2b94566BE5F10276042F7BaBB54985EE119C95";

            if (userAddress.toLowerCase() !== expectedBuyer.toLowerCase()) {
                statusDiv.style.color = "#f87171";
                statusDiv.innerText = "❌ Access Denied: Connected wallet is not the authorized Buyer.";
                alert("Authorization Failed: Please switch to the Buyer wallet (0xeF2b...) inside MetaMask.");
                return;
            }

            statusDiv.innerText = "🔄 Fetching escrow payload specifications...";
            const escrowContract = new ethers.Contract(escrowContractAddress, escrowABI, signer);
            const usdcContract = new ethers.Contract(usdcTokenAddress, erc20ABI, signer);

            const depositAmount = await escrowContract.amount();

            statusDiv.innerText = "🔄 Verifying smart contract token allowance...";
            const currentAllowance = await usdcContract.allowance(userAddress, escrowContractAddress);

            // STEP 1: APPROVE
            if (currentAllowance.lt(depositAmount)) {
                statusDiv.style.color = "#f59e0b";
                statusDiv.innerText = "⚠️ Action Required: Please APPROVE USDC allowance in MetaMask.";
                const approveTx = await usdcContract.approve(escrowContractAddress, depositAmount);
                
                statusDiv.style.color = "#38bdf8";
                statusDiv.innerText = "⏳ Synchronizing allowance allocation on-chain...";
                await approveTx.wait(); 
            }

            // STEP 2: DEPOSIT TRANSACTION
            statusDiv.style.color = "#f59e0b";
            statusDiv.innerText = "⚠️ Action Required: Please CONFIRM the main Escrow Deposit in MetaMask.";
            const depositTx = await escrowContract.deposit();
            
            statusDiv.style.color = "#38bdf8";
            statusDiv.innerText = "⏳ Locking assets securely into Escrow Vault...";
            await depositTx.wait(); 
            
            statusDiv.style.color = "#4ade80";
            statusDiv.innerText = "✅ Success! Vault Deposit Completed Safely.";
            alert("🔒 Escrow Deposit Successful!");

        } catch (error) {
            console.error(error);
            statusDiv.style.color = "#f87171";
            statusDiv.innerText = "❌ Session Aborted: " + (error.data?.message || error.message);
        }
    }
</script>

</body>
</html>
